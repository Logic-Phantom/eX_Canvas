# eX-Canvas(Web Prototyper) 서버 설정 — 이미지로 배치(Gemini 비전). JVM -D 옵션과 환경 변수가 이 값을 덮어쓴다.
#   우선순위 : -Dexcanvas.gemini.xxx  >  환경 변수 EXCANVAS_GEMINI_XXX  >  이 파일  >  코드 기본값
#   API 키는 이 파일에 적지 말고 -Dexcanvas.gemini.apiKey=... 또는 환경 변수 GEMINI_API_KEY 로 준다(커밋 방지).
excanvas.gemini.apiKey=
# 이미지 입력이 되는 무료 등급 모델 : gemini-2.5-flash(기본) · gemini-2.5-flash-lite · gemini-3.5-flash · gemini-3.5-flash-lite
excanvas.gemini.model=gemini-2.5-flash
excanvas.gemini.url=https://generativelanguage.googleapis.com
# responseSchema 로 응답 구조를 강제할지. 기본 false — eXConverter-AI 실측(2026-09-17)에서 스키마를 붙이면
# 3.5-flash 가 표 컬럼 지점에서 반복 생성으로 붕괴했다. responseMimeType=application/json 만으로 JSON 은 강제되고
# 형식 검증은 브라우저(imagePlanner.normalize)가 한다. 새 모델에서 근거가 생기면 켠다.
excanvas.gemini.responseSchema=false
# 추론 토큰도 이 예산을 같이 쓴다. 정상 출력은 수백~2천 토큰. 좁게 잡아 반복 루프를 빨리 판정한다.
excanvas.gemini.maxOutputTokens=8192
# 이보다 긴 출력은 반복 생성으로 보고 온도를 올려 재시도한다.
excanvas.gemini.maxResponseChars=40000
# 1회차 온도. 비정상 출력 재시도는 0.4 → 0.8 로 올린다.
excanvas.gemini.temperature=0
# Gemini 에 보내는 이미지의 긴 변(px). 768 배수라 타일 4개로 끝난다.
excanvas.gemini.maxImageSide=1536
# Gemini 3.x 추론 깊이 MINIMAL | LOW | MEDIUM | HIGH. NONE 이면 thinkingConfig 를 보내지 않는다.
# 2.5 계열은 thinkingLevel 을 거부하므로 코드가 자동으로 빼고 한 번 더 보낸다.
excanvas.gemini.thinkingLevel=MINIMAL
excanvas.gemini.timeoutSeconds=120
# 429/5xx/연결 오류 재시도 횟수(지수 백오프, 오류의 retryDelay 우선)
excanvas.gemini.maxRetries=2
# 사내 HTTP 프록시(필요할 때만)
excanvas.gemini.proxyHost=
excanvas.gemini.proxyPort=8080
